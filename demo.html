<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抖音直播运营助手 · 规则实验室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8efec;color:#172a2d;font:14px/1.55 "PingFang SC","Microsoft YaHei",sans-serif}main{width:min(720px,calc(100vw - 620px));min-width:390px;margin:0 0 64px max(28px,calc((100vw - 1360px)/2));padding:0 0 36px}h1{font-size:28px;line-height:1.2;margin:0 0 8px;font-weight:700}h2{font-size:14px;margin:20px 0 9px;font-weight:700}p{color:#53666a}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #cbd6d4;margin-bottom:25px}.brand{display:flex;gap:10px;align-items:center;font-weight:700}.brand-mark{width:25px;height:25px;display:grid;place-items:center;background:#173a3b;color:white;border-radius:5px;font-size:13px}.brand small{padding-left:10px;border-left:1px solid #b8c7c3;font-weight:400}.downloads{display:flex;gap:7px}.intro{max-width:610px;margin:0 0 20px}.eyebrow{margin:0 0 7px;color:#08796f;font-size:11px;font-weight:700}.intro-copy{font-size:13px;margin:0;color:#53666a}.stage{border:1px solid #294c4b;padding:16px 18px 10px;margin:0 0 17px;border-radius:7px;background:#173a3b;color:#fff;box-shadow:0 5px 15px #18383922}.onair{display:flex;gap:10px;align-items:center;min-height:28px}.onair span{width:8px;height:8px;background:#d76048;border-radius:50%;box-shadow:0 0 0 3px #d7604833}.onair strong{font-size:13px}.onair small{margin-left:auto;color:#c2d4d0;font-size:11px}.buttons{display:flex;gap:7px;flex-wrap:wrap}button,a.download{font:inherit;border:1px solid #c4d1ce;background:#fff;padding:7px 10px;border-radius:5px;cursor:pointer;color:#233d3e;text-decoration:none;font-size:12px}button:hover,a.download:hover{background:#e2f1ed;border-color:#75aaa0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #08796f;outline-offset:2px}.downloads a{font-size:11px;padding:6px 9px}.downloads a:first-child{background:#08796f;color:#fff;border-color:#08796f}.downloads a:first-child:hover{background:#075b56}small{color:#698083}#chat{min-height:100px;max-height:180px;overflow:auto;margin:10px 0 0;padding:0;list-style:none}#chat li{padding:8px 0;border-top:1px solid #315352;display:flex;gap:12px;font-size:12px;color:#e5eeeb}#chat b{min-width:58px;color:#9fd5c6}label{display:flex;gap:8px;margin-top:10px}input{padding:8px 10px;border:1px solid #bdcbc7;border-radius:5px;flex:1;min-width:0;font:inherit;background:#fff}label button{white-space:nowrap}footer{margin-top:21px;border-top:1px solid #cbd6d4;padding-top:13px;color:#53666a;font-size:11px}.simulation-note{margin:0 0 14px;font-size:11px;color:#53666a}@media(max-width:900px){main{width:calc(100% - 32px);min-width:0;margin:0 16px 40px}.topbar{margin-bottom:21px}}@media(max-width:480px){.topbar{align-items:flex-start;height:auto;padding:12px 0;gap:8px;flex-direction:column}.downloads{width:100%}.downloads a{flex:1;text-align:center}.stage{padding:13px 12px 8px}.onair small{font-size:10px}.buttons{gap:6px}}
</style><style>@media(min-width:561px) and (max-width:1050px){.topbar{height:auto;min-height:58px;flex-wrap:wrap;padding:8px 0;gap:8px}.brand,.downloads{width:100%}.downloads a{flex:1;text-align:center}}</style></head><body><main>
<header class="topbar"><div class="brand"><span class="brand-mark">运</span><span>抖音直播运营助手</span><small>规则实验室</small></div><nav class="downloads"><a class="download" href="https://github.com/EitanWong/douyin-live-operations-assistant/releases/latest/download/douyin-live-operations-assistant-chrome.zip">下载 Chrome 扩展</a><a class="download secondary" href="https://github.com/EitanWong/douyin-live-operations-assistant/releases/latest/download/douyin-live-operations-assistant.user.js">油猴兼容脚本</a></nav></header>
<section class="intro"><p class="eyebrow">本地模拟器 · 不连接抖音</p><h1>先验证规则，再开始场控</h1><p class="intro-copy">用模拟礼物、进场和弹幕检查筛选结果。右侧面板就是扩展中的真实控制界面。</p></section>
<p class="simulation-note">晚间闲聊 · 模拟房间 · 主播 UID 1234567890</p><div class="stage"><div class="onair"><span></span><strong>直播信号 / 模拟中</strong><small>仅本地事件</small></div><ul id="chat"><li><b>系统</b><span>在右侧面板开始预览，再选择下面的事件。</span></li></ul></div>
<h2>送出不同价值的礼物</h2><div class="buttons"><button data-event="low">1 钻石小礼物</button><button data-event="high">500 钻石礼物</button><button data-event="combo">50 钻石 × 3 连击</button><button data-event="unknown">单价未知礼物</button></div>
<h2>谁值得一声欢迎</h2><div class="buttons"><button data-event="qualified">35 级 + 本房已点亮</button><button data-event="other">50 级 + 别人家的粉丝团</button><button data-event="unlit">40 级 + 本房未点亮</button><button data-event="low-level">10 级 + 本房已点亮</button></div>
<h2>互动感谢</h2><div class="buttons"><button data-event="like">青山点赞 × 30</button></div>
<h2>试一条弹幕</h2><small>AI 默认关闭。填写接口和密钥后，可在预览模式查看回复。</small><label><input id="message" aria-label="模拟弹幕" value="主播一般几点开播？"> <button id="add-chat">添加弹幕</button></label>
<footer>模拟器不会登录抖音，不会发送真实弹幕，也不保存 AI 密钥到本地磁盘。AI 请求仅在配置后发往你填写的服务。</footer>
</main><script type="module">
import { boot } from './src/app.js';
import { DEFAULTS, copy } from './src/core.js';
const storage = new Map(); const c = copy(DEFAULTS); c.anchorId = '1234567890';
storage.set('live-assistant:config:demo', c);
const request = details => {
  const controller = new AbortController(), timeout = setTimeout(() => controller.abort(), details.timeout);
  fetch(details.url, { method: details.method, body: details.data, headers: details.headers, credentials: 'omit', signal: controller.signal }).then(async response => details.onload({ status: response.status, responseText: await response.text(), finalUrl: response.url })).catch(e => e.name === 'AbortError' ? details.ontimeout() : details.onerror()).finally(() => clearTimeout(timeout));
};
let api; let serial = 0;
boot({ demo: true, get: (key, fallback) => storage.has(key) ? storage.get(key) : fallback, set: (key, value) => storage.set(key, value), del: key => storage.delete(key), request, onReady: value => { api = value; } });
const user = { id: '987654321000001', name: '青山', wealthLevel: 35, fanClubs: [{ anchorId: c.anchorId, level: 8, status: 1 }] };
function emit(e, description) {
  api.engine.ingest({ ...e, id: `demo-${++serial}`, at: Date.now() });
  api.rememberUser(e.user);
  const row = document.createElement('li'), name = document.createElement('b'), text = document.createElement('span'); name.textContent = e.user?.name || '系统'; text.textContent = description; row.append(name, text); document.querySelector('#chat').append(row); row.scrollIntoView({ block: 'nearest' });
}
document.querySelectorAll('[data-event]').forEach(button => button.addEventListener('click', () => {
  const k = button.dataset.event; const u = structuredClone(user);
  if (k === 'like') { emit({ type: 'like', user: u, count: 30, total: 1250 }, `点赞了直播间 ×30，累计 1250`); return; }
  if (['low', 'high', 'combo', 'unknown'].includes(k)) {
    const gift = { type: 'gift', user: u, giftId: k, giftName: { low: '小心意', high: '闪耀心意', combo: '小星星', unknown: '神秘礼物' }[k], unitValue: { low: 1, high: 500, combo: 50, unknown: null }[k], count: 1, final: true, groupId: `group-${serial}` };
    if (k === 'combo') { for (let n = 1; n <= 3; n++) emit({ ...gift, count: n, final: n === 3 }, `送出 ${gift.giftName}，累计 ${n} 个`); }
    else emit(gift, `送出 ${gift.giftName} ×1`);
  } else {
    u.id = { qualified: user.id, other: '987654321000002', unlit: '987654321000003', 'low-level': '987654321000004' }[k]; u.name = { qualified: '青山', other: '海风', unlit: '山月', 'low-level': '小鹿' }[k];
    if (k === 'other') { u.wealthLevel = 50; u.fanClubs[0].anchorId = 'other-host'; }
    if (k === 'unlit') { u.wealthLevel = 40; u.fanClubs[0].status = 2; }
    if (k === 'low-level') u.wealthLevel = 10;
    emit({ type: 'enter', user: u }, `进入直播间：${button.textContent}`);
  }
}));
document.querySelector('#add-chat').addEventListener('click', () => { const text = document.querySelector('#message').value.trim(); if (text) emit({ type: 'chat', user, text }, text); });
</script></body></html>
