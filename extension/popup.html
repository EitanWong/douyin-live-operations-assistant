<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>抖音直播运营助手</title>
  <link rel="stylesheet" href="solid-glass.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="13" rx="4"/><path d="M9 21h6M12 18v3M8 10v3m4-5v7m4-5v3"/></svg></div>
    <div><h1>抖音直播运营助手</h1><p>直播互动 · 多主播 · 礼物账本</p></div>
  </header>
  <main>
    <p class="status" id="status" role="status">正在检查直播间…</p>
    <button id="open" class="primary">打开直播间面板<svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12m-5-5 5 5-5 5"/></svg></button>
    <p class="hint">收入统计已整合到「主播数据 → 收入账本」。<br>开始后默认自动发送；模块按需启用。</p>
    <details>
      <summary>AI 服务访问权限</summary>
      <label>接口地址<input id="endpoint" type="url" placeholder="https://…/chat/completions" autocomplete="url" spellcheck="false"></label>
      <button id="allow">授权这个服务域名</button>
      <p class="hint">仅访问你选择的域名。密钥在直播间面板填写。</p>
      <label>联网搜索接口<input id="search-endpoint" type="url" value="https://api.bochaai.com/v1/web-search" autocomplete="url" spellcheck="false"></label>
      <button id="allow-search">授权搜索服务域名</button>
    </details>
  </main>
  <footer><label class="theme-setting">外观<select data-theme-choice aria-label="显示模式"><option value="system">跟随系统</option><option value="light">亮色</option><option value="dark">暗色</option></select></label><p>修改设置后点开始，可自动保存。</p></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
