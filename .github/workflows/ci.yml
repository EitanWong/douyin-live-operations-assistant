name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  native-perception:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: native/requirements.lock.txt
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r native/requirements.lock.txt
      - name: Verify native contracts and real local media pipeline
        run: python -m unittest discover -s native -v
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify agent index before expensive checks
        run: npm run agent:check
      - name: Build distributables
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Check generated JavaScript
        run: npm run check
      - name: Package Chrome extension
        run: cd dist && zip -qr ../douyin-live-operations-assistant-chrome.zip chrome-extension
      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: douyin-live-operations-assistant-${{ github.sha }}
          path: |
            douyin-live-operations-assistant-chrome.zip
            dist/douyin-live-assistant.user.js
          if-no-files-found: error
          retention-days: 14
